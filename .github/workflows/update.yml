name: Refresh business and commodity news
on:
  push:
    paths:
      - 'scripts/update_news.py'
  schedule:
    - cron: '19 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install monthly-price reader
        run: python -m pip install --disable-pip-version-check openpyxl beautifulsoup4
      - name: Retrieve and curate new headlines and benchmark prices
        run: python scripts/update_news.py
      - name: Save updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update business news and commodity benchmarks'
            git push
          fi
